# 测试级最小配置（仅 @DataJpaTest 切片所需）——与 soda-user-start 主配置同源（ADR-0022）：
# H2 内存库 MySQL 兼容模式 + Flyway V1 建表；ddl-auto=none 防 Hibernate 二次建表与 Flyway 冲突。
spring:
  datasource:
    # DATABASE_TO_LOWER=TRUE 必须保留：V1 反引号建小写表名（user），见主配置注释
    url: jdbc:h2:mem:soda_user_infra_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
