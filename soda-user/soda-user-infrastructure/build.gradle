dependencies {
    // 未来 gateway 实现编译期使用，implementation 不向消费者泄漏编译类路径
    implementation project(':soda-components:soda-component-infrastructure-starter')
    implementation project(':soda-user:soda-user-domain')
    // data-jpa 经 infrastructure-starter api 传递（Auditable 基类所在），此处不重复声明
    // Flyway 数据库迁移（Boot 4 强制 starter + MySQL 方言；H2 方言含在 flyway-core）
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    // BCrypt 密码哈希（CredentialHasherImpl 实现，版本由 Spring Boot BOM 管理）
    implementation 'org.springframework.security:spring-security-crypto'
    // @Slf4j 编译期需要 slf4j-api 在 classpath（data-jpa 未传递至编译 classpath）
    implementation 'org.slf4j:slf4j-api'
    runtimeOnly 'com.mysql:mysql-connector-j'
    // H2 仅测试用（集成测试内存库，MODE=MySQL）
    testRuntimeOnly 'com.h2database:h2'
}
